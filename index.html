<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Junior React Portfolio</title>
    <link rel="stylesheet" href="./app.css" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useState } = React;

      const projects = [
        {
          title: 'Logistics Service Landing',
          stack: 'HTML, CSS, JavaScript',
          description: 'A responsive client-focused landing page built from scratch.'
        },
        {
          title: 'Task Manager SPA',
          stack: 'React, LocalStorage',
          description: 'A clean productivity app for managing tasks and tracking progress.'
        },
        {
          title: 'Movie Explorer',
          stack: 'React, REST API',
          description: 'A searchable movie catalog with smooth filtering and dynamic rendering.'
        }
      ];

      const skills = ['HTML5', 'CSS3', 'JavaScript', 'React', 'Git', 'Responsive Design', 'REST API'];

      function AnimatedSection({ children, delay = 0, className = '', as = 'section', id }) {
        const [isVisible, setIsVisible] = useState(false);

        useEffect(() => {
          const timer = setTimeout(() => setIsVisible(true), delay);
          return () => clearTimeout(timer);
        }, [delay]);

        const Tag = as;
        return (
          <Tag id={id} className={`${className} reveal ${isVisible ? 'reveal-visible' : ''}`}>
            {children}
          </Tag>
        );
      }

      function App() {
        return (
          <div className="page">
            <AnimatedSection as="header" className="hero" delay={80}>
              <div className="aurora" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
              </div>

              <p className="badge">Junior Frontend Developer</p>
              <h1>I build modern interfaces with React and strong UX focus ✨</h1>
              <p>
                I turn ideas into polished web experiences: responsive layouts, clean components,
                and smooth micro-interactions.
              </p>
              <a href="#contacts" className="button">Let&apos;s work together</a>
            </AnimatedSection>

            <AnimatedSection className="card glass" delay={180}>
              <h2>About Me</h2>
              <p>
                I am a junior frontend developer who enjoys building fast, accessible, and visually
                pleasing interfaces. I care about details, structure, and user flow.
              </p>
            </AnimatedSection>

            <AnimatedSection className="card glass" delay={280}>
              <h2>Skills</h2>
              <div className="skills">
                {skills.map((skill, index) => (
                  <span key={skill} className="skill-pill" style={{ animationDelay: `${0.3 + index * 0.08}s` }}>
                    {skill}
                  </span>
                ))}
              </div>
            </AnimatedSection>

            <AnimatedSection className="card glass" delay={380}>
              <h2>Selected Projects</h2>
              <div className="projects">
                {projects.map((project, index) => (
                  <article key={project.title} className="project" style={{ animationDelay: `${0.2 + index * 0.14}s` }}>
                    <h3>{project.title}</h3>
                    <p className="stack">{project.stack}</p>
                    <p>{project.description}</p>
                  </article>
                ))}
              </div>
            </AnimatedSection>

            <AnimatedSection as="footer" id="contacts" className="card glass" delay={480}>
              <h2>Contacts</h2>
              <p>Email: junior.dev@example.com</p>
              <p>Telegram: @juniordev</p>
              <p>GitHub: github.com/juniordev</p>
            </AnimatedSection>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
